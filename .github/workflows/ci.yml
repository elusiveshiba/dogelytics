name: CI

on:
  push:
    branches: [main, feature/release-prep]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dogelytics
          POSTGRES_USER: dogelytics
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dogelytics -d dogelytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOGELYTICS_TEST_DBURL: postgres://dogelytics:test-password@127.0.0.1:5432/dogelytics?sslmode=disable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal img)"
      - name: Unit tests
        run: DOGELYTICS_TEST_DBURL= go test ./...
      - name: PostgreSQL storage integration tests
        run: go test ./internal/store -run Integration -v
      - name: PostgreSQL CLI integration tests
        run: go test ./cmd/dogelytics -run Integration -v
      - name: Race detection
        run: DOGELYTICS_TEST_DBURL= go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...
      - name: Dependency vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Generate test secrets
        run: ./scripts/setup-compose.sh
      - name: Build and smoke-test Compose stack
        run: |
          python3 -m http.server 8000 --bind 0.0.0.0 --directory testdata/indexer >/tmp/dogelytics-fake-indexer.log 2>&1 &
          fake_indexer_pid=$!
          trap 'kill "$fake_indexer_pid"' EXIT
          docker compose up -d --build --wait
          curl --fail --silent --show-error http://127.0.0.1:4420/livez
          curl --fail --silent --show-error http://127.0.0.1:4420/readyz
          docker compose run --rm dogelytics version
          test "$(docker inspect dogelytics-dogelytics-1 --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker inspect dogelytics-dogelytics-1 --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
      - name: Scan local image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: dogelytics:local
          version: v0.72.0
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Build amd64 and arm64 OCI archive
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/dogelytics.oci.tar
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
